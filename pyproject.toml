[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "take2-voice-starter"
version = "1.0.0"
description = "Take2 voice agent hackathon starter, built on LiveKit Agents"
requires-python = ">=3.10, <3.15"

dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "livekit-agents~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "pypdf>=7.0.0",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"
# Vendored from the post-interview lane (teammate-owned): never reformatted or linted here,
# so the files stay byte-identical to that branch.
extend-exclude = ["src/interviewer", "src/postcall.py", "evals/ai_detect", "tests/test_delivery_port.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

