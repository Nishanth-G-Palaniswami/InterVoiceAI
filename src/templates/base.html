<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InterviewAI{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
    nav a { margin-right: 1rem; }
    h1 { margin-top: 1.5rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    label small { font-weight: normal; color: #666; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 0.4rem; font: inherit; }
    input[type="file"] { padding: 0; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.4rem; font: inherit; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
    dt { font-weight: 600; margin-top: 0.6rem; }
    dd { margin: 0; }
    pre { white-space: pre-wrap; background: #f6f6f6; padding: 0.8rem; }
    small { color: #666; }
  </style>
</head>
<body>
  <nav><a href="/">Apply</a><a href="/candidates">Candidates</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
