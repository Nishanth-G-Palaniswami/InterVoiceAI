{% extends "base.html" %}
{% block title %}Apply - InterviewAI{% endblock %}
{% block content %}
<h1>Apply</h1>
<p>Tell us about yourself and upload your resume. The phone interviewer prepares its questions from what you submit here.</p>
<form method="post" action="/apply" enctype="multipart/form-data">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required>

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" required placeholder="(212) 555-0142">

  <label for="email">Email</label>
  <input id="email" name="email" type="email">

  <label for="role">Role applying for</label>
  <input id="role" name="role" type="text" required>

  <label for="company">Company <small>(optional)</small></label>
  <input id="company" name="company" type="text">

  <label for="education">Education</label>
  <input id="education" name="education" type="text">

  <label for="years_experience">Years of experience</label>
  <input id="years_experience" name="years_experience" type="number" min="0" max="60">

  <label for="current_job">What do you do in your current job?</label>
  <textarea id="current_job" name="current_job" rows="3" maxlength="600"></textarea>

  <label for="biggest_project">Biggest project you have shipped?</label>
  <textarea id="biggest_project" name="biggest_project" rows="3" maxlength="600"></textarea>

  <label for="why_this_role">Why this role?</label>
  <textarea id="why_this_role" name="why_this_role" rows="3" maxlength="600"></textarea>

  <label for="resume">Resume <small>(.pdf or .txt)</small></label>
  <input id="resume" name="resume" type="file" required accept=".pdf,.txt">

  <button type="submit">Apply</button>
</form>
{% endblock %}
